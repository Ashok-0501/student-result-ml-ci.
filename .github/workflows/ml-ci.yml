name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train student result model
        run: python train_model.py
      - name: Check ML quality gate
        run: python quality_gate.py
      - name: Run ML tests
        run: python -m unittest test_ml_pipeline -v
      - name: Run Flask API tests
        run: python -m unittest test_app -v
      - name: Run FastAPI logging and validation tests
        run: python -m unittest test_fastapi -v
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_results.csv
          if-no-files-found: error
          retention-days: 7
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py student_result_model.pkl metrics.json requirements.txt Dockerfile .dockerignore render.yaml test_fastapi.py release_candidate/
          cp -r deployment release_candidate/
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

  docker-test-and-publish:
    needs: train-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: pip install -r requirements.txt
      - name: Train model for containers
        run: python train_model.py

      - name: Build Flask Docker image
        run: docker build -t student-result-ml-ci:flask .
      - name: Start Flask container
        run: docker run -d --name student-result-flask -p 5000:5000 student-result-ml-ci:flask
      - name: Smoke-test Flask API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Flask health check passed"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs student-result-flask
              exit 1
            fi
            sleep 1
          done
          response=$(curl --fail --silent --show-error -X POST http://localhost:5000/predict             -H "Content-Type: application/json"             --data '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}')
          echo "$response"
          echo "$response" | grep -q '"prediction"'
      - name: Capture Flask container logs
        if: always()
        run: docker logs student-result-flask || true
      - name: Clean up Flask container
        if: always()
        run: docker rm -f student-result-flask || true

      - name: Build FastAPI Docker image
        run: docker build -f deployment/fastapi/Dockerfile -t student-result-ml-ci:fastapi .
      - name: Start FastAPI container
        run: docker run -d --name student-result-fastapi -p 8000:8000 student-result-ml-ci:fastapi
      - name: Smoke-test FastAPI logging service
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "FastAPI health check passed"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs student-result-fastapi
              exit 1
            fi
            sleep 1
          done
          response=$(curl --fail --silent --show-error -X POST http://localhost:8000/predict             -H "Content-Type: application/json"             --data '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}')
          echo "$response"
          echo "$response" | grep -q '"prediction"'
      - name: Capture FastAPI container logs
        if: always()
        run: docker logs student-result-fastapi || true
      - name: Clean up FastAPI container
        if: always()
        run: docker rm -f student-result-fastapi || true

      - name: Log in to GitHub Container Registry
        if: success()
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag tested images
        if: success()
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/student-result-prediction"
          docker tag student-result-ml-ci:flask "$IMAGE:flask"
          docker tag student-result-ml-ci:flask "$IMAGE:flask-${GITHUB_SHA}"
          docker tag student-result-ml-ci:fastapi "$IMAGE:latest"
          docker tag student-result-ml-ci:fastapi "$IMAGE:sha-${GITHUB_SHA}"
      - name: Publish tested images to GHCR
        if: success()
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/student-result-prediction"
          docker push "$IMAGE:flask"
          docker push "$IMAGE:flask-${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
